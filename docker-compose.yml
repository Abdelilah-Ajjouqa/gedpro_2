services:
  postgres:
    image: postgres:16-alpine
    container_name: gedpro_postgres
    environment:
      POSTGRES_USER: gedpro_user
      POSTGRES_PASSWORD: gedpro_password
      POSTGRES_DB: gedpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gedpro_user -d gedpro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gedpro_network

  mongodb:
    image: mongo:7
    container_name: gedpro_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: gedpro_user
      MONGO_INITDB_ROOT_PASSWORD: gedpro_password
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "gedpro_user", "--password", "gedpro_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gedpro_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gedpro_app
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: gedpro_user
      POSTGRES_PASSWORD: gedpro_password
      POSTGRES_DB: gedpro_db
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      MONGODB_URI: mongodb://gedpro_user:gedpro_password@mongodb:27017/gedpro?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-different-refresh-secret-change-in-production
      EMAIL_PROVIDER: log
      EMAIL_WEBHOOK_SECRET: your-email-webhook-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
      PORT: 3000
      UPLOAD_DIR: uploads
      DOCUMENT_STORAGE_PROVIDER: s3
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: gedpro_minio
      S3_SECRET_KEY: gedpro_minio_password
      S3_BUCKET: gedpro-documents
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gedpro_network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gedpro_minio
      MINIO_ROOT_PASSWORD: gedpro_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gedpro_network

volumes:
  postgres_data:
  mongodb_data:
  minio_data:

networks:
  gedpro_network:
    driver: bridge
