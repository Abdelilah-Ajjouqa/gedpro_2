name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gedpro
          POSTGRES_PASSWORD: gedpro_ci_password
          POSTGRES_DB: gedpro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gedpro -d gedpro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: gedpro
      POSTGRES_PASSWORD: gedpro_ci_password
      POSTGRES_DB: gedpro_test
      MONGODB_URI: mongodb://localhost:27017/gedpro_test
      JWT_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
      EMAIL_WEBHOOK_SECRET: ci-webhook-secret-at-least-thirty-two-characters
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'false'
      DOCUMENT_STORAGE_PROVIDER: local
      UPLOAD_DIR: /tmp/gedpro-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run api:types:check
      - run: npm run test --workspace @gedpro/web
      - run: npm run test:a11y --workspace @gedpro/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @gedpro/web
      - run: npm run test:cov
      - name: Verify migrations apply, roll back, and reapply
        run: |
          npm run migration:run
          npm run migration:revert
          npm run migration:run
      - run: npm run test:e2e
      - run: npm run openapi:check
      - name: Build production image
        run: docker build -f apps/api/Dockerfile -t gedpro-api:${{ github.sha }} .
